{% extends "base.html" %}
{% block title %}Sign in &middot; CBES Project Set-Up{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Local test login. Enter your name (recorded on the project) and the shared password.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>Your name
      <input type="text" name="username" required autofocus placeholder="e.g. Andy Flaws">
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
