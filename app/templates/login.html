{% extends "base.html" %}
{% block title %}Sign in &middot; CBES Project Set-Up{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Sign in with your email and password. Your email is recorded on each project you set up.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>Email
      <input type="email" name="username" required autofocus value="{{ username or local_email or '' }}" placeholder="you@city-holdings.co.uk">
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
